<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <rect width="1600" height="950" fill="white"/>
  <text x="70" y="70" font-family="Arial" font-size="44" font-weight="700" fill="#111">Proposed AWS Cost-Optimized Architecture</text>
  <text x="72" y="115" font-family="Arial" font-size="24" fill="#444">Clara fintech technical assessment: FinOps governance, optimized compute, optimized storage, and continuous cost control</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker>
    <style>.box{fill:#f7f7f7;stroke:#333;stroke-width:3}.h{font:700 28px Arial;fill:#111}.t{font:21px Arial;fill:#333}.foot{font:23px Arial;fill:#111}.line{stroke:#555;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="box" x="70" y="190" width="390" height="230" rx="20"/><text class="h" x="95" y="235">AWS Organizations</text><text class="t" x="100" y="280"><tspan x="100" dy="0">• Multi-account structure</tspan><tspan x="100" dy="32">• Cost allocation tags</tspan><tspan x="100" dy="32">• SCP / AWS Config guardrails</tspan><tspan x="100" dy="32">• Budget ownership per team</tspan></text>
  <rect class="box" x="605" y="190" width="405" height="230" rx="20"/><text class="h" x="630" y="235">FinOps Governance Layer</text><text class="t" x="635" y="280"><tspan x="635" dy="0">• Cost Explorer + CUR</tspan><tspan x="635" dy="32">• AWS Budgets</tspan><tspan x="635" dy="32">• Cost Anomaly Detection</tspan><tspan x="635" dy="32">• Compute Optimizer</tspan><tspan x="635" dy="32">• Monthly optimization review</tspan></text>
  <rect class="box" x="1160" y="190" width="370" height="230" rx="20"/><text class="h" x="1185" y="235">Reporting &amp; Accountability</text><text class="t" x="1190" y="280"><tspan x="1190" dy="0">• Workload cost dashboards</tspan><tspan x="1190" dy="32">• Owner-based chargeback</tspan><tspan x="1190" dy="32">• Forecasting review</tspan><tspan x="1190" dy="32">• Executive savings tracking</tspan></text>
  <line class="line" x1="460" y1="305" x2="605" y2="305"/><line class="line" x1="1010" y1="305" x2="1160" y2="305"/>
  <line class="line" x1="265" y1="420" x2="265" y2="535"/><line class="line" x1="807" y1="420" x2="807" y2="535"/><line class="line" x1="1345" y1="420" x2="1345" y2="535"/>
  <rect class="box" x="70" y="535" width="390" height="250" rx="20"/><text class="h" x="95" y="580">Optimized Compute</text><text class="t" x="100" y="625"><tspan x="100" dy="0">• EC2 rightsizing</tspan><tspan x="100" dy="32">• Auto Scaling Groups</tspan><tspan x="100" dy="32">• Savings Plans candidates</tspan><tspan x="100" dy="32">• Spot for resilient workloads</tspan><tspan x="100" dy="32">• Higher utilization targets</tspan></text>
  <rect class="box" x="605" y="535" width="405" height="250" rx="20"/><text class="h" x="630" y="580">Optimized EKS</text><text class="t" x="635" y="625"><tspan x="635" dy="0">• Karpenter / Cluster Autoscaler</tspan><tspan x="635" dy="32">• Mixed instance node groups</tspan><tspan x="635" dy="32">• Spot node pools</tspan><tspan x="635" dy="32">• Scale-to-demand capacity</tspan><tspan x="635" dy="32">• Cluster cost visibility</tspan></text>
  <rect class="box" x="1160" y="535" width="370" height="250" rx="20"/><text class="h" x="1185" y="580">Optimized Storage</text><text class="t" x="1190" y="625"><tspan x="1190" dy="0">• Remove unattached EBS</tspan><tspan x="1190" dy="32">• gp3 migration candidates</tspan><tspan x="1190" dy="32">• Snapshot lifecycle policy</tspan><tspan x="1190" dy="32">• S3 Intelligent-Tiering</tspan><tspan x="1190" dy="32">• Archive infrequent data</tspan></text>
  <text class="foot" x="70" y="875">Target outcome: reduce monthly AWS spend from $250K to ~$180K while preserving performance, scalability, and operational control.</text>
</svg>
